<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>割線から接線へ｜微分係数</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--ink:#16181d;--muted:#6d7280;--line:#d9dde7;--accent:#3b5ccc;--r:#d97706;--l:#0f8b8d;--good:#177245;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
  header,main{max-width:1100px;margin:0 auto;padding:0 20px}
  header{padding-top:28px;padding-bottom:12px}
  h1{margin:0 0 8px;font-size:clamp(26px,5vw,44px);letter-spacing:-.03em}
  .sub,.small{color:var(--muted);font-size:14px;line-height:1.7}
  main{padding-bottom:40px;display:grid;grid-template-columns:1.35fr .9fr;gap:18px}
  @media(max-width:850px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(20,30,60,.06);overflow:hidden}
  .pad{padding:18px}
  canvas{display:block;width:100%;height:auto;aspect-ratio:800/520;background:#fff;touch-action:none}
  .bar{padding:12px 18px;border-bottom:1px solid var(--line);background:#fbfcff;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .t{font-weight:700;margin:0 0 8px;font-size:16px}
  select,input[type=number]{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
  select{width:100%}input[type=number]{width:110px}
  input[type=range]{width:100%}
  button{appearance:none;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
  .p{background:var(--accent);color:#fff}.s{background:#eef1fb;color:#24366f}.g{background:#fff;border:1px solid var(--line);color:var(--ink)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9db0f5;outline-offset:2px}
  .eq{font-family:"Times New Roman",serif;font-size:20px;text-align:center;padding:12px 8px;background:#f8f9fd;border:1px solid var(--line);border-radius:12px;line-height:1.7}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
  th.r,td.r{color:var(--r)}th.l,td.l{color:var(--l)}
  tr.now{background:#f1f4ff;font-weight:700}
  .msg{min-height:90px;border-radius:14px;padding:14px;margin-top:12px;border:1px solid var(--line);background:#fafbfe;line-height:1.7;font-size:14.5px}
  .msg.good{border-color:#a8d8bf;background:#f1fbf5;color:#0e5f38}.msg.bad{border-color:#efb1ad;background:#fff5f4;color:#8e1f18}
  .step{margin-top:16px}
  .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 18px 14px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  label.chk{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<header>
  <h1>割線から接線へ</h1>
  <div class="sub">2点の間隔 <b>h</b> をどんどん小さくすると、2点を通る直線（割線）の傾きはどうなるでしょうか。右側・左側の両方から近づけて確かめましょう。</div>
</header>
<main>
<section class="card">
  <div class="bar">
    <span class="small">点 P を動かす</span>
    <label class="chk">a <input type="range" id="aS" min="-2" max="2" step="0.1" value="1" style="width:160px" aria-label="a の値"></label>
    <b id="aV">a = 1.0</b>
    <label class="chk"><input type="checkbox" id="zm"> h に合わせて拡大</label>
  </div>
  <canvas id="cv" width="800" height="520" role="img" aria-label="関数のグラフと割線"></canvas>
  <div class="lg">
    <span><span class="dot" style="background:var(--accent)"></span>y = f(x)</span>
    <span><span class="dot" style="background:var(--r)"></span>右から近づける（h &gt; 0）</span>
    <span><span class="dot" style="background:var(--l)"></span>左から近づける（h &lt; 0）</span>
    <span><span class="dot" style="background:#111"></span>点 P(a, f(a))</span>
  </div>
</section>

<aside class="card"><div class="pad">
  <div class="t">① 関数を選ぶ</div>
  <select id="fn" aria-label="関数を選ぶ"></select>
  <div class="eq" id="eq" style="margin-top:12px"></div>

  <div class="step">
    <div class="t">② h を小さくしてみる</div>
    <input type="range" id="hS" min="0" max="1000" value="0" aria-label="h の大きさ">
    <div class="row small" style="display:flex;justify-content:space-between"><span>大きい (h=1)</span><b id="hV" style="color:var(--ink)"></b><span>小さい (h=0.001)</span></div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="s" id="shrink">▶ 自動で縮める</button><button class="g" id="reset">h を戻す</button></div>
    <table><thead><tr><th>|h|</th><th class="r">右の傾き</th><th class="l">左の傾き</th></tr></thead><tbody id="tb"></tbody></table>
  </div>

  <div class="step">
    <div class="t">③ 予想する：h→0 のとき傾きは？</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input type="number" id="gs" step="0.01" placeholder="例 1.5" aria-label="予想する値">
      <button class="p" id="chk">確かめる</button>
      <button class="g" id="none">近づく値はない</button>
    </div>
    <div class="msg" id="msg">表の数値や図の動きを見てから、傾きが近づく値を予想してみましょう。</div>
  </div>
</div></aside>
</main>

<script>
const F={
 sq:{n:"f(x)=x²",f:x=>x*x,d:x=>2*x,a:1,tex:"f(x)=x²",why:a=>`h を小さくすると、右からも左からも傾きは 2a = ${(2*a).toFixed(2)} に近づきます。<br>(f(a+h)−f(a))/h = (2ah+h²)/h = 2a+h なので、h→0 で 2a になります。`},
 cu:{n:"f(x)=x³−x",f:x=>x*x*x-x,d:x=>3*x*x-1,a:1,tex:"f(x)=x³−x",why:a=>`傾きは 3a²−1 = ${(3*a*a-1).toFixed(2)} に近づきます。<br>(f(a+h)−f(a))/h = 3a²−1+3ah+h² なので、h→0 で 3a²−1 です。`},
 sn:{n:"f(x)=sin x",f:Math.sin,d:Math.cos,a:1,tex:"f(x)=sin x",why:a=>`傾きは cos a = ${Math.cos(a).toFixed(3)} に近づきます。<br>拡大すると曲線がほぼ直線に見えることも確かめてみましょう。`},
 ab:{n:"f(x)=|x|（a=0 が見どころ）",f:Math.abs,d:x=>Math.abs(x)<1e-9?NaN:Math.sign(x),a:0,tex:"f(x)=|x|",why:a=>Math.abs(a)<1e-9
  ?`a=0 では、右からの傾きは +1、左からの傾きは −1 のままで、同じ値に近づきません。<br>極限が存在しないので、<b>x=0 で微分係数は存在しません</b>（グラフが尖っているため、拡大しても直線になりません）。`
  :`a=${a.toFixed(1)} では、このあたりは直線 y=${a>0?"x":"−x"} なので、傾きは ${Math.sign(a)} です。<br>a=0 のときだけ尖っていて、微分係数がありません。a を 0 に合わせてみましょう。`}
};
const fs=document.getElementById("fn");
for(const k in F){fs.add(new Option(F[k].n,k))}
const $=id=>document.getElementById(id),cv=$("cv"),c=cv.getContext("2d");
let key="sq",a=1,t=0,timer=null;
const hOf=()=>Math.pow(10,-3*t/1000);           // 1 → 0.001
const fmt=v=>Number.isFinite(v)?v.toFixed(4):"—";
const sl=(f,a,h)=>(f(a+h)-f(a))/h;

function draw(){
  const o=F[key],f=o.f,h=hOf(),W=800,H=520;
  const hw=$("zm").checked?Math.max(h*3,0.004):3, hh=hw*H/W;
  const cy=f(a),X=x=>(x-a+hw)/(2*hw)*W,Y=y=>H/2-(y-cy)/hh*H/2;
  c.clearRect(0,0,W,H);
  // grid
  c.strokeStyle="#eceff5";c.lineWidth=1;c.fillStyle="#98a0b3";c.font="12px sans-serif";
  const st=Math.pow(10,Math.floor(Math.log10(hw/2)));
  for(let x=Math.ceil((a-hw)/st)*st;x<a+hw;x+=st){c.beginPath();c.moveTo(X(x),0);c.lineTo(X(x),H);c.stroke();}
  for(let y=Math.ceil((cy-hh)/st)*st;y<cy+hh;y+=st){c.beginPath();c.moveTo(0,Y(y));c.lineTo(W,Y(y));c.stroke();}
  if(a-hw<0&&a+hw>0){c.strokeStyle="#c3c9d8";c.beginPath();c.moveTo(X(0),0);c.lineTo(X(0),H);c.stroke();}
  // curve
  c.strokeStyle="#3b5ccc";c.lineWidth=3;c.beginPath();
  for(let i=0;i<=W;i+=2){const x=a-hw+2*hw*i/W,y=Y(f(x));i?c.lineTo(i,y):c.moveTo(i,y);}c.stroke();
  // secants
  const sec=(hh_,col)=>{const m=sl(f,a,hh_);c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();
    c.moveTo(X(a-hw),Y(cy-m*hw));c.lineTo(X(a+hw),Y(cy+m*hw));c.stroke();
    c.fillStyle=col;c.beginPath();c.arc(X(a+hh_),Y(f(a+hh_)),6,0,7);c.fill();return m;};
  const mr=sec(h,"#d97706"),ml=sec(-h,"#0f8b8d");
  c.fillStyle="#111";c.beginPath();c.arc(X(a),Y(cy),7,0,7);c.fill();
  c.font="bold 14px sans-serif";c.fillText("P",X(a)+10,Y(cy)-10);
  // labels
  $("aV").textContent="a = "+a.toFixed(1);
  $("hV").textContent="h = ±"+h.toPrecision(2);
  $("eq").innerHTML=`${o.tex}, a=${a.toFixed(1)}<br><span style="font-size:15px">傾き = (f(a+h)−f(a)) / h<br>右: <b style="color:var(--r)">${fmt(mr)}</b>　左: <b style="color:var(--l)">${fmt(ml)}</b></span>`;
  // table
  let rows="";for(const e of [0,-1,-2,-3]){const hv=Math.pow(10,e),near=Math.abs(Math.log10(h)-e)<0.25;
    rows+=`<tr class="${near?"now":""}"><td>${hv}</td><td class="r">${fmt(sl(f,a,hv))}</td><td class="l">${fmt(sl(f,a,-hv))}</td></tr>`;}
  $("tb").innerHTML=rows;
}
function setFn(k){key=k;a=F[k].a;$("aS").value=a;t=0;$("hS").value=0;stop();msg("");draw();}
function msg(h,cls){const m=$("msg");m.className="msg "+(cls||"");m.innerHTML=h||"表の数値や図の動きを見てから、傾きが近づく値を予想してみましょう。";}
function stop(){clearInterval(timer);timer=null;$("shrink").textContent="▶ 自動で縮める";}
function judge(none){
  const o=F[key],d=o.d(a),why=o.why(a),has=!Number.isNaN(d);
  if(none){has?msg(`惜しい！この場合は <b>${d.toFixed(2)}</b> に近づきます。<br>${why}`,"bad"):msg(`正解です！<br>${why}`,"good");return;}
  const g=parseFloat($("gs").value);if(Number.isNaN(g)){msg("数値を入力するか、「近づく値はない」を押してください。","bad");return;}
  if(!has)msg(`この場合は、右と左で近づく値が違うため、1つの値には決まりません。<br>${why}`,"bad");
  else if(Math.abs(g-d)<0.03)msg(`正解です！ f′(a) = <b>${d.toFixed(2)}</b><br>${why}`,"good");
  else msg(`もう一度。表の下の方の行（|h| が小さい行）を見てみましょう。答えは ${d.toFixed(2)} です。<br>${why}`,"bad");
}
fs.onchange=e=>setFn(e.target.value);
$("aS").oninput=e=>{a=+e.target.value;msg("");draw();};
$("hS").oninput=e=>{t=+e.target.value;stop();draw();};
$("zm").onchange=draw;
$("reset").onclick=()=>{t=0;$("hS").value=0;stop();draw();};
$("shrink").onclick=()=>{if(timer)return stop();if(t>=1000)t=0;$("shrink").textContent="■ 止める";
  timer=setInterval(()=>{t=Math.min(1000,t+6);$("hS").value=t;draw();if(t>=1000)stop();},30);};
$("chk").onclick=()=>judge(false);$("none").onclick=()=>judge(true);
$("gs").onkeydown=e=>{if(e.key==="Enter")judge(false);};
setFn("sq");
</script>
</body>
</html>
